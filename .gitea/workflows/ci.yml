name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The Viewer's CSS is built with Tailwind during dotnet build.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore
        run: dotnet restore FluxorViewer.sln

      - name: Build
        run: dotnet build FluxorViewer.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test --solution FluxorViewer.sln --no-build --configuration Release

      # PK-3: catch a broken package early. Nothing is published.
      - name: Pack
        run: tools/pack.sh
