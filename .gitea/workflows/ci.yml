name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore FluxorViewer.sln

      - name: Build
        run: dotnet build FluxorViewer.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test --solution FluxorViewer.sln --no-build --configuration Release
